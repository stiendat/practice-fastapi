version: '3.8'
services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: library_db
    ports:
      - "5432:5432"

  fastapi:
    build: .
    command: python -m src.utils.init_db
    volumes:
      - .:/app
    depends_on:
      - db
